name: Deploy to Dev Environment 

on:
  push:
    branches: [dev]
  paths_ignore:
    - README.md

concurrency:
  group: dev/${{ github.workflow }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-22.04
    permissions:
      contents:  read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive' 
          token: ${{ secrets.CROSS_REPO }}

      - name: Configure Git credentials for submodules
        run: |
           git config --global url."https://caltos:${{ secrets.CROSS_REPO }}@github.com/".insteadOf "https://github.com/"

      - name: Update submodules to latest
        run: |
          git submodule update --remote --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Setup Doppler CLI
        uses:  dopplerhq/cli-action@v3

      - name:  Retrive Envs from Doppler
        run: |
          doppler secrets download --no-file --format=env > .env
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PROD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.CROSS_REPO }} 

      - name: Build and push Image  🐳
        uses:  docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ghcr.io/princeps-finance/${{ github.repository }}:dev
  
  docker-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents:  read
      packages: write
    steps:
      - name: Code Checkout
      - uses: actions/checkout@v4

      - name: Copy Compose File To Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USERNAME_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          source: './infra/deployments/dev-compose.yml'
          target: apps/mobile-admin-portal
          overwrite: true
          strip_components: 3

      - name: Deploy Core Admin UI
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_DEV }}
          username: ${{ secrets.SSH_USERNAME_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          script_stop: true
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u princeps-finance --password-stdin
            docker pull ghcr.io/princeps-finance/${{ github.repository }}:dev
            docker compose -f apps/mobile-admin-portal/dev-compose.dev.yml up -d --force-recreate
            docker image prune -f