name: Deploy to Dev Environment 

on:
  push:
    branches: [production]
    paths-ignore:
      - README.md
      - .gitignore

concurrency:
  group: prod/${{ github.workflow }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-22.04
    permissions:
      contents:  read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive' 
          token: ${{ secrets.CROSS_REPO }}

      - name: Configure Git credentials for submodules
        run: |
           git config --global url."https://princeps-finance:${{ secrets.CROSS_REPO }}@github.com/".insteadOf "https://github.com/"

      - name: Update submodules to latest
        run: |
          git submodule update --remote --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # - name: Setup Doppler CLI
      #   uses:  dopplerhq/cli-action@v3

      # - name:  Retrive Envs from Doppler
      #   run: |
      #     doppler secrets download --no-file --format=env > .env
      #   env:
      #     DOPPLER_TOKEN: ${{ secrets.PROD_DOPPLER_TOKEN }}
      
      # - name:  Retrive Envs from Secrets
      #   run: |
      #     echo "NG_APP_API_URL=${{ secrets.NG_APP_API_URL_PROD }}" > .env
      #     echo "NG_APP_ENCRYPTION_KEY=${{ secrets.NG_APP_ENCRYPTION_KEY_PROD }}" >> .env
      #     echo "NG_APP_AUTH_SESSION_USER=${{ secrets.NG_APP_AUTH_SESSION_USER_PROD }}" >> .env
      #     echo "NG_APP_AUTH_SESSION_TOKEN=${{ secrets.NG_APP_AUTH_SESSION_TOKEN_PROD }}" >> .env
      #     echo "NG_APP_AWS_URL=${{ secrets.NG_APP_AWS_URL_PROD }}" >> .env
      

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.CROSS_REPO }} 

      - name: Build and push Image  🐳
        uses:  docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ghcr.io/princeps-finance/core-admin-portal:prod
  
  docker-deploy:
    needs: docker-build
    runs-on: ubuntu-22.04
    permissions:
      contents:  read
      packages: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Copy Compose File To Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USERNAME_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          source: './infra/deployments/prod-compose.yml'
          target: apps/mobile-admin-portal
          overwrite: true
          strip_components: 3

      - name: Deploy Core Admin UI
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USERNAME_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          script_stop: true
          script: |
            echo ${{ secrets.CROSS_REPO }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ghcr.io/princeps-finance/core-admin-portal:dev
            docker compose -f apps/mobile-admin-portal/prod-compose.yml up -d --force-recreate
            docker image prune -f
