<div class="flex flex-col items-center justify-center bg-white py-20">
  <img
    src="images/empty-state.png"
    class="h-[9rem] object-contain shrink-0"
    alt="empty state"
  />
  <ng-container
    *ngTemplateOutlet="emptyDescriptionTemplate() || defaultEmptyDescription"
  >
  </ng-container>
  <ng-template #defaultEmptyDescription>
    <p class="text-sm font-medium text-center text-[#7E868B]">
      {{ emptyStateDescription() }}
    </p>
  </ng-template>
  <ng-container *ngTemplateOutlet="emptyfooterTemplate()"> </ng-container>
</div>
