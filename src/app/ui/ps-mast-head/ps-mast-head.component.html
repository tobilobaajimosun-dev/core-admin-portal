<div class="border-b border-[#EFEFEF] bg-white">
  <div class="h-16 flex items-center justify-between gap-3 px-4 md:px-6">

    <!-- Hamburger — mobile/tablet only -->
    <button
      type="button"
      class="md:hidden flex items-center justify-center w-10 h-10 -ml-2 rounded-lg text-[#2B3033] hover:bg-[#F5F7FA] transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      aria-label="Open menu"
      (click)="menuClick.emit()"
    >
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M2.5 5h15M2.5 10h15M2.5 15h15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
    </button>

    <!-- Welcome Message -->
    <p class="text-base text-coal truncate min-w-0 flex-1 md:flex-none">
      Welcome back, <span class="font-semibold">{{ user()?.first_name || 'User' }}</span>
    </p>

    <!-- Right side: Search + Notifications -->
    <div class="flex items-center gap-2 md:gap-4">

      <!-- Demo data toggle -->
      <button
        type="button"
        (click)="toggleDemo()"
        [attr.aria-pressed]="demoMode.enabled()"
        title="Toggle Asset Flex demo data"
        class="hidden sm:flex items-center gap-2 rounded-full border h-8 px-3 text-xs font-medium cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        [class]="demoMode.enabled() ? 'border-primary text-primary' : 'border-[#D2DBE1] text-[#6B7280]'"
      >
        <span class="w-1.5 h-1.5 rounded-full"
          [style.background]="demoMode.enabled() ? 'var(--color-primary-hex, #00b3ff)' : '#C9CED4'"></span>
        Demo data
      </button>

      <!-- Search — full input from md up -->
      <div class="relative hidden md:block">
        <input
          #desktopSearchInput
          type="text"
          [(ngModel)]="searchText"
          (ngModelChange)="onSearchChange($event)"
          (keyup.enter)="submitSearch()"
          placeholder="Search customers, loans or businesses"
          class="text-sm outline-none rounded-lg border border-[#D2DBE1] bg-white py-2 pl-9 pr-9 w-[380px] transition-colors placeholder:text-[#9CA3AF] hover:border-[#B0BAC4] focus:border-primary focus:ring-1 focus:ring-primary"
        />
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#9CA3AF] pointer-events-none"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        @if (searchText) {
          <button
            type="button"
            (click)="clearSearch(desktopSearchInput)"
            aria-label="Clear search"
            class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center justify-center w-6 h-6 rounded-full text-[#9CA3AF] hover:text-[#2B3033] hover:bg-[#F5F7FA] transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-width="2" d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        }
      </div>

      <!-- Search — icon toggle below md -->
      <button
        type="button"
        class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg text-[#2B3033] hover:bg-[#F5F7FA] transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        aria-label="Search"
        [attr.aria-expanded]="showMobileSearch"
        (click)="showMobileSearch = !showMobileSearch"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </button>

      <!-- Notifications -->
      <div class="relative">
        <button
          type="button"
          (click)="toggleNotifications()"
          [attr.aria-expanded]="notifOpen()"
          class="flex items-center gap-2 text-[#2B3033] font-medium
                 hover:text-primary transition-colors text-sm cursor-pointer">
          <ps-svg-icon name="notifications-icon"></ps-svg-icon>
          <span class="hidden md:inline">Notifications</span>

          <!-- Unread badge on the button -->
          @if (unreadCount() > 0) {
            <span class="flex items-center justify-center
                         bg-[#B32F00] text-white font-semibold text-[10px] min-w-[13px]
                         h-[19px] px-1 py-0.5 rounded-[3px] leading-none">
              {{ unreadCount() }}
            </span>
          }
        </button>

        @if (notifOpen()) {
          <app-notification-dropdown
            [notifications]="notifications()"
            (closed)="closeNotifications()"
            (markAllRead)="markAllNotificationsRead()"
          />
        }
      </div>

    </div>
  </div>

  <!-- Mobile search row — expands below the header bar -->
  @if (showMobileSearch) {
    <div class="md:hidden px-4 pb-3">
      <div class="relative">
        <input
          #mobileSearchInput
          type="text"
          [(ngModel)]="searchText"
          (ngModelChange)="onSearchChange($event)"
          (keyup.enter)="submitSearch()"
          placeholder="Search customers, loans or businesses"
          class="text-base outline-none rounded-lg border border-[#D2DBE1] bg-white py-2.5 pl-9 pr-10 w-full transition-colors placeholder:text-[#9CA3AF] hover:border-[#B0BAC4] focus:border-primary focus:ring-1 focus:ring-primary"
        />
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[#9CA3AF] pointer-events-none"
          fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        @if (searchText) {
          <button
            type="button"
            (click)="clearSearch(mobileSearchInput)"
            aria-label="Clear search"
            class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center justify-center w-7 h-7 rounded-full text-[#9CA3AF] hover:text-[#2B3033] hover:bg-[#F5F7FA] transition-colors cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-width="2" d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        }
      </div>
    </div>
  }
</div>
