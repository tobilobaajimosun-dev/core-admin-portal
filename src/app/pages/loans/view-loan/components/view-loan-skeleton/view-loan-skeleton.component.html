<!-- components/view-loan-skeleton/view-loan-skeleton.component.html -->
<div class="px-6 pb-6">

  <!-- back button placeholder -->
  <div class="py-5">
    <div class="h-9 w-32 rounded-lg bg-gray-200 animate-pulse"></div>
  </div>

  <div class="flex gap-4 items-start">

    <!-- ══════ LEFT COLUMN ══════ -->
    <div class="w-[365px] shrink-0 flex flex-col gap-[15px]">

      <!-- customer card -->
      <div class="relative rounded-xl border border-[#ECF1F5] overflow-hidden">
        <div class="absolute inset-0 h-[103px] bg-gray-100 animate-pulse"></div>
        <div class="relative pt-10 px-4 pb-4">
          <div class="bg-white rounded-xl border border-[#ECF1F5] px-4 pb-4 flex flex-col items-center text-center">
            <div class="w-16 h-16 rounded-full bg-gray-200 animate-pulse mt-5 mb-3"></div>
            <div class="h-5 w-40 rounded-full bg-gray-200 animate-pulse mb-2"></div>
            <div class="h-4 w-48 rounded-full bg-gray-200 animate-pulse"></div>
          </div>
          <div class="h-9 w-full rounded-lg bg-gray-200 animate-pulse mt-3"></div>
          <div class="h-9 w-full rounded-lg bg-gray-200 animate-pulse mt-2"></div>
        </div>
      </div>

      <!-- details card -->
      <div class="rounded-xl border border-[#ECF1F5] bg-white px-4 pt-5 pb-2">
        <div class="h-4 w-32 rounded-full bg-gray-200 animate-pulse mb-4"></div>
        @for (i of [1,2,3,4,5,6]; track i) {
          <div class="flex items-center justify-between py-3 border-b border-[#F3F7F9] last:border-b-0">
            <div class="h-3.5 w-24 rounded-full bg-gray-200 animate-pulse"></div>
            <div class="h-3.5 w-20 rounded-full bg-gray-200 animate-pulse"></div>
          </div>
        }
      </div>

    </div>

    <!-- ══════ RIGHT COLUMN ══════ -->
    <div class="flex-1 flex flex-col gap-4 min-w-0">

      <!-- stats card -->
      <div class="rounded-xl border border-[#ECF1F5] bg-white px-8 py-5 flex items-center justify-between">
        @for (i of [1,2,3,4]; track i) {
          <div class="flex flex-col gap-2">
            <div class="h-3 w-28 rounded-full bg-gray-200 animate-pulse"></div>
            <div class="h-7 w-24 rounded-lg bg-gray-200 animate-pulse"></div>
          </div>
        }
      </div>

      <!-- table / list card -->
      <div class="rounded-xl border border-[#ECF1F5] bg-white px-4 pt-5 pb-2">
        <div class="h-4 w-40 rounded-full bg-gray-200 animate-pulse mb-4"></div>
        @for (i of [1,2,3,4,5]; track i) {
          <div class="flex items-center justify-between py-3 border-b border-[#F3F7F9] last:border-b-0">
            <div class="h-3.5 w-40 rounded-full bg-gray-200 animate-pulse"></div>
            <div class="h-3.5 w-20 rounded-full bg-gray-200 animate-pulse"></div>
          </div>
        }
      </div>

    </div>
  </div>
</div>
