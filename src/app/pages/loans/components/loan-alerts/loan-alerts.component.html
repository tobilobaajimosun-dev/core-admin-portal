<div class="grid grid-cols-2 gap-3 mb-6">

  @for (alert of alerts(); track alert.key) {
    <button
      type="button"
      (click)="navigate(alert.route)"
      class="flex flex-col gap-2 rounded-[6px] bg-white border border-[#E2E8F0]/[0.55] text-left
             px-5 py-4 min-h-[117px] hover:bg-[#F8FCFE] transition-colors cursor-pointer
             shadow-[0px_0px_1px_0px_rgba(0,0,0,0.01),0px_2px_1px_0px_rgba(0,0,0,0.01)]"
      style="border-width: 0.55px;">

      <div class="flex items-center justify-between w-full">
        <span class="text-sm font-semibold text-[#131719] tracking-[-0.005em]">
          {{ alert.title }}
        </span>
        <svg class="w-4 h-4 text-[#00B3FF] shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
        </svg>
      </div>

      <span class="text-[32px] font-bold text-[#131719] leading-none">
        {{ alert.value }}
      </span>

      <span class="text-xs font-normal text-[#51575B] tracking-[-0.005em]">
        {{ alert.subtitle }}
      </span>

    </button>
  }

</div>
