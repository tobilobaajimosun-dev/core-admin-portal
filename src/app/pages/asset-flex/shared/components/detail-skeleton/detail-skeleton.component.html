<div class="detail-skeleton" role="status" [attr.aria-label]="label()">
  <div class="detail-skeleton__head">
    <span class="pa-skeleton detail-skeleton__avatar" aria-hidden="true"></span>
    <span class="detail-skeleton__head-lines">
      <span class="pa-skeleton" style="width: 220px; height: 18px;" aria-hidden="true"></span>
      <span class="pa-skeleton" style="width: 140px;" aria-hidden="true"></span>
    </span>
  </div>
  <div class="detail-skeleton__card">
    <span class="pa-skeleton" style="width: 100%;" aria-hidden="true"></span>
    <span class="pa-skeleton" style="width: 90%;" aria-hidden="true"></span>
    <span class="pa-skeleton" style="width: 70%;" aria-hidden="true"></span>
  </div>
</div>
