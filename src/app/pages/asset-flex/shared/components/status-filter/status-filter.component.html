<div class="status-filter" (clickOutside)="close()">
  <button
    type="button"
    class="pa-filter"
    [class.pa-filter--active]="active() !== ''"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
    (click)="toggle()"
  >
    {{ triggerLabel() }}
    <hugeicons-icon [icon]="arrowIcon" [size]="14" [strokeWidth]="2" color="currentColor" />
  </button>

  @if (open()) {
    <div class="status-filter__menu" role="listbox" aria-label="Filter by status">
      @for (o of options(); track o.value) {
        <button
          type="button"
          class="status-filter__option"
          role="option"
          [attr.aria-selected]="active() === o.value"
          (click)="select(o.value)"
        >
          <span>{{ o.label }}</span>
          @if (active() === o.value) {
            <hugeicons-icon [icon]="tickIcon" [size]="16" [strokeWidth]="2" color="currentColor" />
          }
        </button>
      }
    </div>
  }
</div>
