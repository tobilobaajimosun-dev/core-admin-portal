@if (chips().length > 0) {
  <div class="chips" role="group" aria-label="Applied filters">
    @for (chip of chips(); track chip.key) {
      <span class="chip">
        <button type="button" class="chip__remove" (click)="clearChip(chip.key)" [attr.aria-label]="'Remove ' + chip.label + ' filter'">
          <hugeicons-icon [icon]="closeIcon" [size]="13" [strokeWidth]="1.75" color="currentColor" />
        </button>
        <button type="button" class="chip__body" (click)="sectionClick.emit(chip.key)">
          <span class="chip__label">{{ chip.label }}</span>
          <span class="chip__value">{{ chip.value }}</span>
        </button>
      </span>
    }
    <button type="button" class="chips__clear" (click)="clearAll.emit()">Clear filters</button>
  </div>
}
