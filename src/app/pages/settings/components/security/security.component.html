<div class="max-w-[600px]">

  <!-- Password section -->
  <div>
    <h2 class="text-base font-semibold text-[#2B3033] tracking-[-0.005em]">
      Password
    </h2>
    <p class="text-sm font-normal text-[#51575B] tracking-[-0.005em] leading-[140%] mt-0.5 mb-5">
      Change your password below
    </p>

    <button type="button" (click)="openChangePasswordModal()"
      class="w-full flex items-center justify-center gap-2 py-3 rounded-lg border border-[#E2E8F0]
        bg-white text-sm font-medium text-[#131719] hover:bg-gray-50 transition-colors cursor-pointer">
      Change my password
      <svg class="w-4 h-4 text-[#51575B]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5
             m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
      </svg>
    </button>
  </div>

</div>
