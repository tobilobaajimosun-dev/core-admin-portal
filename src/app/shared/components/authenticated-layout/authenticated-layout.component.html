<div class="flex h-screen overflow-hidden">

  <!-- Sidebar — fixed, full height -->
  <aside class="fixed left-0 top-0 h-full z-30 flex-shrink-0"
    style="width: var(--sidebar-width);">
    <ps-sidebar></ps-sidebar>
  </aside>

  <!-- Main area — offset by sidebar width -->
  <div class="flex flex-col flex-1 overflow-hidden"
    style="margin-left: var(--sidebar-width);">

    <!-- Header — fixed at top, full width minus sidebar -->
    <header class="flex-shrink-0 z-20">
      <ps-mast-head></ps-mast-head>
    </header>

    <!-- Scrollable content -->
    <main class="flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
