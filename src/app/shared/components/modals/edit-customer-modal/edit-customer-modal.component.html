<div class="flex flex-col bg-white border border-[#ECF0F3] rounded-2xl overflow-hidden w-[560px]">

  <!-- ── Header ── -->
  <div class="flex items-start justify-between px-6 pt-6 pb-4 flex-shrink-0">
    <div>
      <h3 class="text-[18.46px] font-semibold text-[#060708] leading-none tracking-[-0.005em]">
        Edit customer details
      </h3>
    </div>
    <button
      type="button"
      (click)="close()"
      class="size-8 inline-flex justify-center items-center rounded-full border border-transparent
             bg-gray-100 hover:bg-gray-200 focus:outline-none focus:bg-gray-200
             disabled:opacity-50 disabled:pointer-events-none cursor-pointer"
      aria-label="Close">
      <span class="sr-only">Close</span>
      <svg class="shrink-0 w-4 h-4" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M12.6671 3.33325L3.33374 12.6666M3.33374 3.33325L12.6671 12.6666"
          stroke="#121212" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- ── Scrollable body ── -->
  <div class="flex flex-col gap-5 px-6 pb-2 overflow-y-auto max-h-[72vh]
              [scrollbar-width:thin] [scrollbar-color:#E5E7EB_transparent]
              [&::-webkit-scrollbar]:w-1 [&::-webkit-scrollbar-track]:bg-transparent
              [&::-webkit-scrollbar-thumb]:bg-[#E5E7EB] [&::-webkit-scrollbar-thumb]:rounded-full">

    <!-- Subtitle -->
    <p class="text-sm font-normal text-[#51575B] leading-[140%] tracking-[-0.005em]">
      Update customer profile details below
    </p>

    <!-- First Name + Last Name -->
    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-[13px] font-medium text-[#2B3033] tracking-[0px]">First Name</label>
        <input
          type="text"
          [ngModel]="firstName()"
          (ngModelChange)="firstName.set($event)"
          placeholder="First name"
          class="w-full h-[41px] px-3 py-2.5 rounded-lg border border-[#D2DBE1] bg-white
                 text-[13.33px] text-[#2B3033] leading-[140%] tracking-[-0.005em]
                 placeholder-[#AAB3BA] outline-none transition-colors
                 focus:border-[#00B3FF] focus:ring-1 focus:ring-[#00B3FF]" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[13px] font-medium text-[#2B3033] tracking-[0px]">Last Name</label>
        <input
          type="text"
          [ngModel]="lastName()"
          (ngModelChange)="lastName.set($event)"
          placeholder="Last name"
          class="w-full h-[41px] px-3 py-2.5 rounded-lg border border-[#D2DBE1] bg-white
                 text-[13.33px] text-[#2B3033] leading-[140%] tracking-[-0.005em]
                 placeholder-[#AAB3BA] outline-none transition-colors
                 focus:border-[#00B3FF] focus:ring-1 focus:ring-[#00B3FF]" />
      </div>
    </div>

    <!-- Email Address (read-only) -->
    <div class="flex flex-col gap-1.5">
      <label class="text-[13px] font-medium text-[#2B3033] tracking-[0px]">Email Address</label>
      <div class="w-full min-h-[41px] flex items-center px-3 py-2.5 rounded-lg bg-black/[0.08]
                  text-[13.33px] text-[#2B3033] leading-[140%] tracking-[-0.005em]">
        {{ modalData.email }}
      </div>
    </div>

    <!-- Phone Number (read-only) -->
    <div class="flex flex-col gap-1.5">
      <label class="text-[13px] font-medium text-[#2B3033] tracking-[0px]">Phone number</label>
      <div class="w-full min-h-[41px] flex items-center px-3 py-2.5 rounded-lg bg-black/[0.08]
                  text-[13.33px] text-[#2B3033] leading-[140%] tracking-[-0.005em]">
        {{ modalData.phoneNumber }}
      </div>
    </div>

    <!-- Gender -->
    <div class="flex flex-col gap-1.5">
      <label class="text-[13px] font-medium text-[#2B3033] tracking-[0px]">Gender</label>
      <ps-select
        [ngModel]="gender()"
        (selectionChanged)="onGenderChange($event)"
        placeholder="Select gender"
        itemId="gender-select">
        @for (opt of genderOptions; track opt) {
          <ps-select-option [value]="opt" [label]="opt"></ps-select-option>
        }
      </ps-select>
    </div>

    <!-- Work Type -->
    <div class="flex flex-col gap-1.5">
      <label class="text-[13px] font-medium text-[#2B3033] tracking-[0px]">Work Type</label>
      <ps-select
        [ngModel]="workType()"
        (selectionChanged)="onWorkTypeChange($event)"
        placeholder="Select work type"
        itemId="work-type-select">
        @for (opt of workTypeOptions; track opt) {
          <ps-select-option [value]="opt" [label]="opt"></ps-select-option>
        }
      </ps-select>
    </div>

    <!-- Workplace -->
    <div class="flex flex-col gap-1.5 pb-2">
      <label class="text-[13px] font-medium text-[#2B3033] tracking-[0px]">Workplace</label>
      <input
        type="text"
        [ngModel]="workplace()"
        (ngModelChange)="workplace.set($event)"
        placeholder="Enter workplace"
        class="w-full h-[41px] px-3 py-2.5 rounded-lg border border-[#D2DBE1] bg-white
               text-[13.33px] text-[#2B3033] leading-[140%] tracking-[-0.005em]
               placeholder-[#AAB3BA] outline-none transition-colors
               focus:border-[#00B3FF] focus:ring-1 focus:ring-[#00B3FF]" />
    </div>

  </div>

  <!-- ── Footer ── -->
  <div class="flex items-center justify-end gap-3 px-6 py-5 border-t border-[#F3F7F9]">
    <button
      type="button"
      (click)="close()"
      class="px-5 py-2.5 rounded-lg border border-[#E2E8F0] bg-white text-[13px]
             font-medium text-[#131719] hover:bg-gray-50 transition-colors cursor-pointer">
      Cancel
    </button>
    <button
      type="button"
      (click)="save()"
      [disabled]="!canSave()"
      class="w-[190px] h-10 flex items-center justify-center gap-2 rounded-lg text-[13px]
             font-semibold transition-all duration-200 border-none disabled:cursor-not-allowed
             cursor-pointer enabled:bg-[#00B3FF] enabled:text-white
             disabled:bg-black/[0.05] disabled:text-[#2B3033]/40">
      <span>Save update</span>
      <svg class="w-[15px] h-[15px]" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
  </div>

</div>
