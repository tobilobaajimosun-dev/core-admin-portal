<div class="flex flex-col bg-white border border-[#ECF0F3] rounded-2xl overflow-hidden w-[480px]">


    <!-- ══════════════════════════════════
         FORM STATE
    ══════════════════════════════════ -->

    <!-- Header -->
    <div class="flex items-start justify-between px-6 pt-6 pb-4 flex-shrink-0">
      <h3 class="text-lg font-semibold text-[#131719] leading-none tracking-[-0.005em]">
        Suspend customer?
      </h3>
      <button
        type="button"
        (click)="close()"
        class="size-8 inline-flex justify-center items-center rounded-full border border-transparent
               bg-gray-100 hover:bg-gray-200 focus:outline-none focus:bg-gray-200
               disabled:opacity-50 disabled:pointer-events-none cursor-pointer"
        aria-label="Close">
        <span class="sr-only">Close</span>
        <svg class="shrink-0 w-4 h-4" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M12.6671 3.33325L3.33374 12.6666M3.33374 3.33325L12.6671 12.6666"
            stroke="#121212" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="flex flex-col gap-5 px-6 pb-2">

      <!-- Warning text -->
      <p class="text-sm font-normal text-[#51575B] leading-[140%]">
        This action cannot be undone. Type the role name to confirm
      </p>

      <!-- Select reason -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[13px] font-medium text-[#2B3033] tracking-[0px]">
          Select reason
        </label>
        <ps-select
          [ngModel]="selectedReason()"
          (selectionChanged)="onReasonChange($event)"
          placeholder="Select a reason to suspend this account"
          itemId="suspend-reason-select">
          @for (reason of reasons; track reason) {
            <ps-select-option [value]="reason" [label]="reason"></ps-select-option>
          }
        </ps-select>
      </div>

      <!-- Custom reason textarea — only when "Other" is selected -->
      @if (isOther()) {
        <div class="flex flex-col gap-1.5">
          <label class="text-[13px] font-medium text-[#2B3033] tracking-[0px]">
            Reason
          </label>
          <textarea
            [ngModel]="customReason()"
            (ngModelChange)="customReason.set($event)"
            placeholder="Type your reason here"
            rows="5"
            class="w-full px-3 py-2.5 rounded-lg border border-[#D2DBE1] bg-white resize-none
                   text-[13.33px] text-[#2B3033] leading-[140%] tracking-[-0.005em]
                   placeholder-[#AAB3BA] outline-none transition-colors
                   focus:border-[#00B3FF] focus:ring-1 focus:ring-[#00B3FF]">
          </textarea>
        </div>
      }

    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 px-6 py-5 mt-2">
      <button
        type="button"
        (click)="close()"
        class="px-5 py-2.5 rounded-lg border border-[#E2E8F0] bg-white text-sm font-medium
               text-[#131719] hover:bg-gray-50 transition-colors cursor-pointer">
        Cancel
      </button>
      <button
        type="button"
        (click)="suspend()"
        [disabled]="!canSuspend()"
        class="px-5 py-2.5 rounded-lg text-sm font-medium transition-all duration-200
               disabled:cursor-not-allowed cursor-pointer
               enabled:bg-[#00B3FF] enabled:text-white
               disabled:bg-[#EBEBEB] disabled:text-[#ABABAB]">
        Suspend customer
      </button>
    </div>

</div>
