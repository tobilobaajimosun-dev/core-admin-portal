<div class="duration-300 opacity-100 ease-out transition-all w-full">
  <div class="flex flex-col bg-white border border-[#ECF0F3] rounded-2xl pointer-events-auto modal-background overflow-hidden">

    <!-- Close -->
    <div class="flex justify-end pt-4 px-5">
      <button (click)="close()" type="button"
        class="size-8 inline-flex justify-center items-center rounded-full border border-transparent bg-gray-100 text-coal hover:bg-gray-200 focus:outline-none focus:bg-gray-200 disabled:opacity-50 disabled:pointer-events-none"
        aria-label="Close">
        <span class="sr-only">Close</span>
        <svg class="shrink-0 w-4 h-4" width="16" height="16" viewBox="0 0 16 16" fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path d="M12.6671 3.33325L3.33374 12.6666M3.33374 3.33325L12.6671 12.6666" stroke="#121212"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="px-8 pb-8 pt-2 flex flex-col items-center text-center space-y-5">

      <!-- Bell / lock-out illustration -->
      <img src="images/notification-alert.png" class="w-20 h-20" width="80" height="80" alt="Locked out" />

      <!-- Heading & description -->
      <div class="space-y-1.5">
        <h3 class="text-[#060708] font-semibold text-xl tracking-[-0.01em]">
          You're locked out
        </h3>
        <p class="text-[#2B3033] text-sm font-normal leading-[148%] tracking-[-0.01em]">
          Too many wrong guesses. For security, we've paused your account for {{ lockoutMinutes }} minutes.
        </p>
      </div>

      <!-- CTA -->
      <button
        type="button"
        (click)="onResetPassword()"
        class="w-full py-2.5 rounded-md text-sm font-medium bg-primary text-white hover:opacity-90 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
        Reset your password
      </button>

    </div>
  </div>
</div>
