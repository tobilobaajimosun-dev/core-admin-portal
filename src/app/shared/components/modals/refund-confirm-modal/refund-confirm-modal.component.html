<div class="flex flex-col bg-white border border-[#ECF0F3] rounded-2xl pointer-events-auto modal-background overflow-hidden w-full">

  <!-- Header -->
  <div class="flex items-center justify-between px-6 py-5 border-b border-[#ECF1F5]">
    <h3 class="text-xl font-bold text-[#131719]">Refund Transaction</h3>
    <button type="button" (click)="cancel()"
      class="text-[#9CA3AF] hover:text-[#131719] transition-colors cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Body -->
  <div class="px-6 py-8 space-y-4">
    <p class="text-sm text-[#2B3033]">
      You are about to refund ₦{{ amount | number:'1.0-0' }} to the customer's wallet.
    </p>
    <p class="text-sm text-[#2B3033]">
      This action cannot be undone.
    </p>
  </div>

  <!-- Footer -->
  <div class="flex items-center justify-end gap-3 border-t border-[#F3F7F9] px-6 py-4">
    <button type="button" (click)="cancel()"
      class="px-6 py-2.5 rounded-lg text-sm font-medium border border-[#E2E8F0] bg-white
        text-[#131719] hover:bg-gray-50 transition-colors cursor-pointer">
      Cancel
    </button>
    <button type="button" (click)="confirmRefund()"
      class="px-6 py-2.5 rounded-lg text-sm font-medium bg-[#00B3FF] text-white
        hover:bg-[#009FE6] transition-colors cursor-pointer">
      Refund Transaction
    </button>
  </div>

</div>
